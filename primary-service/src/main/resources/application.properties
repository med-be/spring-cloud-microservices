spring.application.name=primary-service

server.port=8082

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true

resilience4j.circuitbreaker.instances.unknownService.sliding-window-size=10
resilience4j.circuitbreaker.instances.unknownService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.unknownService.wait-duration-in-open-state=30000
resilience4j.circuitbreaker.instances.unknownService.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.unknownService.permitted-number-of-calls-in-half-open-state=5

resilience4j.circuitbreaker.instances.unknownService.allow-health-indicator-to-fail=true
resilience4j.circuitbreaker.instances.unknownService.register-health-indicator=true

management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
